# Entorno de desarrollo local (el enunciado permite compose solo para esto).
#
# NINGUN servicio publica puertos hacia afuera: al sistema solo se entra
# por el API Gateway (RNF09). Los servicios se hablan entre si por la red
# interna, llamandose por su nombre.
#
# Para medir rendimiento hacen falta los puertos abiertos; para eso esta
# docker-compose.pruebas.yml, que los agrega solo mientras se mide.
#
#   docker compose up inventario            levanta Inventario y su MySQL
#   docker compose logs -f inventario       ver los logs
#   docker compose down                     apagar todo
#
# Cada integrante agrega aqui el bloque de sus servicios. Mantiene el
# archivo Jasmin, segun el reparto de la Entrega 3.

services:

  # ---------------------------------------------------------------
  # Inventario (Amanda)
  # ---------------------------------------------------------------
  inventario-db:
    image: mysql:8.0
    container_name: inventario-db
    environment:
      # Estas variables las entiende la imagen oficial de MySQL y con ellas
      # crea la base y el usuario la primera vez que arranca.
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventario_db
      MYSQL_USER: inventario
      MYSQL_PASSWORD: inventario
    volumes:
      # Volumen con nombre: los datos sobreviven a  docker compose down.
      - datos-inventario:/var/lib/mysql
    healthcheck:
      # Avisa cuando MySQL ya acepta conexiones. Sin esto, el servicio
      # arranca antes que la base y falla al conectarse.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  inventario:
    build: ./services/inventario
    container_name: inventario-service
    environment:
      NOMBRE_SERVICIO: inventario
      DB_HOST: inventario-db        # el nombre del servicio funciona como DNS
      DB_PUERTO: 3306
      DB_NOMBRE: inventario_db
      DB_USUARIO: inventario
      DB_CLAVE: inventario
      # Las tablas las crea inicializa_bd.py antes de Gunicorn,
      # asi que la aplicacion no debe volver a crearlas.
      CREAR_TABLAS: "false"
      CONFIGURACION_URL: http://configuracion-service:8000
      PROVEEDORES_URL: http://proveedores-service:8000
      REPOSICION_URL: http://reposicion-service:8000
      STOCK_MINIMO_POR_DEFECTO: 5
    depends_on:
      inventario-db:
        condition: service_healthy  # espera a que la base este lista

  # ---------------------------------------------------------------
  # Reposicion (Amanda)
  # ---------------------------------------------------------------
  reposicion-db:
    image: mysql:8.0
    container_name: reposicion-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reposicion_db
      MYSQL_USER: reposicion
      MYSQL_PASSWORD: reposicion
    volumes:
      - datos-reposicion:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  reposicion:
    build: ./services/reposicion
    container_name: reposicion-service
    environment:
      NOMBRE_SERVICIO: reposicion
      DB_HOST: reposicion-db
      DB_PUERTO: 3306
      DB_NOMBRE: reposicion_db
      DB_USUARIO: reposicion
      DB_CLAVE: reposicion
      # Las tablas las crea inicializa_bd.py antes de Gunicorn,
      # asi que la aplicacion no debe volver a crearlas.
      CREAR_TABLAS: "false"
      INVENTARIO_URL: http://inventario-service:8000
      PROVEEDORES_URL: http://proveedores-service:8000
      CONFIGURACION_URL: http://configuracion-service:8000
      STOCK_MINIMO_POR_DEFECTO: 5
      FACTOR_REPOSICION: 3
    depends_on:
      reposicion-db:
        condition: service_healthy

  # MySQL compartido: init.sql crea una base y un usuario por servicio.
  mysql:
    image: mysql:8.0
    container_name: jak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - datos-mysql:/var/lib/mysql
      # Se ejecuta solo la primera vez que arranca MySQL (volumen vacio).
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # 127.0.0.1 (TCP) y no localhost (socket), para no darlo por listo
      # mientras MySQL todavia esta ejecutando init.sql.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - jak-red

  # Configuracion
  configuracion:
    build: ./services/configuracion
    container_name: configuracion-service
    environment:
      NOMBRE_SERVICIO: configuracion
      DB_HOST: mysql                  # el nombre del servicio funciona como DNS
      DB_PUERTO: 3306
      DB_NOMBRE: configuracion_db
      DB_USUARIO: configuracion
      DB_CLAVE: configuracion
      # Las tablas las crea inicializa_bd.py antes de Gunicorn,
      # asi que la aplicacion no debe volver a crearlas.
      CREAR_TABLAS: "false"
      STOCK_MINIMO_POR_DEFECTO: 5     # stock minimo con el que se crea cada empresa
    depends_on:
      mysql:
        condition: service_healthy    # espera a que MySQL este listo
    networks:
      - default                       # red de inventario y reposicion
      - jak-red

  # Ventas
  ventas:
    build: ./services/ventas
    container_name: ventas-service
    environment:
      NOMBRE_SERVICIO: ventas
      DB_HOST: mysql
      DB_PUERTO: 3306
      DB_NOMBRE: ventas_db
      DB_USUARIO: ventas
      DB_CLAVE: ventas
      # Las tablas las crea inicializa_bd.py antes de Gunicorn,
      # asi que la aplicacion no debe volver a crearlas.
      CREAR_TABLAS: "false"
      INVENTARIO_URL: http://inventario-service:8000
      BALANCE_URL: http://balance-service:8000
      TIMEOUT_SEGUNDOS: 3
      MAX_INTENTOS: 3
      # "true": simula a Inventario (bodega 1 y precio fijo).
      # "false": llama a inventario-service.
      USAR_MOCK_INVENTARIO: "true"
      MOCK_PRECIO: 10000
      MOCK_STOCK_DISPONIBLE: 100
    depends_on:
      mysql:
        condition: service_healthy
      balance:
        condition: service_started
    networks:
      - default                       # para llamar a inventario-service
      - jak-red

  # Balance Diario
  balance:
    build: ./services/balance
    container_name: balance-service
    environment:
      NOMBRE_SERVICIO: balance-diario
      DB_HOST: mysql
      DB_PUERTO: 3306
      DB_NOMBRE: balance_db
      DB_USUARIO: balance
      DB_CLAVE: balance
      # Las tablas las crea inicializa_bd.py antes de Gunicorn,
      # asi que la aplicacion no debe volver a crearlas.
      CREAR_TABLAS: "false"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - jak-red

  # API Gateway: unico servicio que publica un puerto (8080).
  # gateway:
  #   build: ./services/gateway
  #   container_name: gateway-service
  #   environment:
  #     NOMBRE_SERVICIO: gateway
  #     DB_HOST: mysql
  #     DB_PUERTO: 3306
  #     DB_NOMBRE: gateway_db
  #     DB_USUARIO: gateway
  #     DB_CLAVE: gateway
  #     CONFIGURACION_URL: http://configuracion-service:8000
  #     VENTAS_URL: http://ventas-service:8000
  #     BALANCE_URL: http://balance-service:8000
  #     INVENTARIO_URL: http://inventario-service:8000
  #     REPOSICION_URL: http://reposicion-service:8000
  #     PROVEEDORES_URL: http://proveedores-service:8000
  #     REPORTES_URL: http://reportes-service:8000
  #   ports:
  #     - "8080:8000"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - default
  #     - jak-red

  # Proveedores
  # proveedores:
  #   build: ./services/proveedores
  #   container_name: proveedores-service
  #   environment:
  #     NOMBRE_SERVICIO: proveedores
  #     DB_HOST: mysql
  #     DB_NOMBRE: proveedores_db
  #     DB_USUARIO: proveedores
  #     DB_CLAVE: proveedores
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - default
  #     - jak-red

  # Reportes
  # reportes:
  #   build: ./services/reportes
  #   container_name: reportes-service
  #   environment:
  #     NOMBRE_SERVICIO: reportes
  #     DB_HOST: mysql
  #     DB_NOMBRE: reportes_db
  #     DB_USUARIO: reportes
  #     DB_CLAVE: reportes
  #     VENTAS_URL: http://ventas-service:8000
  #     BALANCE_URL: http://balance-service:8000
  #     INVENTARIO_URL: http://inventario-service:8000
  #     CONFIGURACION_URL: http://configuracion-service:8000
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - default
  #     - jak-red

networks:
  jak-red:
    name: jak-red

volumes:
  datos-inventario:
  datos-reposicion:
  datos-mysql:
