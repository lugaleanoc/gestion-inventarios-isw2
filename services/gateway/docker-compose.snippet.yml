  gateway-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: gateway_db
      MYSQL_USER: gateway
      MYSQL_PASSWORD: gateway_pass
    volumes:
      - gateway_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway-service:
    build: ./services/gateway
    environment:
      DB_HOST: gateway-db
      DB_PORT: "3306"
      DB_NAME: gateway_db
      DB_USER: gateway
      DB_PASSWORD: gateway_pass
      JWT_SECRET: jak-secreto-local-cambiar
      EXPONER_CODIGO_RECUPERACION: "true"
    depends_on:
      gateway-db:
        condition: service_healthy
    ports:
      - "8080:8000"

# En la sección volumes: del archivo agregar
#   gateway_data:
