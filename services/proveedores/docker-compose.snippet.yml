  proveedores-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: proveedores_db
      MYSQL_USER: proveedores
      MYSQL_PASSWORD: proveedores_pass
    volumes:
      - proveedores_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  proveedores-service:
    build: ./services/proveedores
    environment:
      DB_HOST: proveedores-db
      DB_PORT: "3306"
      DB_NAME: proveedores_db
      DB_USER: proveedores
      DB_PASSWORD: proveedores_pass
    depends_on:
      proveedores-db:
        condition: service_healthy

# En la sección volumes: del archivo agregar
#   proveedores_data:
