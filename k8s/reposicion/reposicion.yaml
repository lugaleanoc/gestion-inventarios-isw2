# Manifiestos de Kubernetes del microservicio de Reposicion (RNF04).
#
#   kubectl apply -f k8s/base/            primero el namespace y la config
#   kubectl apply -f k8s/reposicion/      luego este archivo
#
# Un archivo puede contener varios objetos separados por "---".
---
# ConfigMap: configuracion que NO es secreta. Se monta como variables de
# entorno dentro del contenedor, asi la imagen no lleva nada fijo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reposicion-config
  namespace: jak-inventory
data:
  NOMBRE_SERVICIO: "reposicion"
  DB_HOST: "reposicion-db"
  DB_PUERTO: "3306"
  DB_NOMBRE: "reposicion_db"
  CREAR_TABLAS: "true"
  INVENTARIO_URL: "http://inventario-service:8000"
  PROVEEDORES_URL: "http://proveedores-service:8000"
  CONFIGURACION_URL: "http://configuracion-service:8000"
  FACTOR_REPOSICION: "3"
  STOCK_MINIMO_POR_DEFECTO: "5"
---
# Secret: usuario y clave de la base. En un proyecto real no se sube al
# repositorio; aqui va con valores de ejemplo para poder desplegar en clase.
apiVersion: v1
kind: Secret
metadata:
  name: reposicion-secret
  namespace: jak-inventory
type: Opaque
stringData:
  DB_USUARIO: "reposicion"
  DB_CLAVE: "reposicion"
  MYSQL_ROOT_PASSWORD: "root"
---
# PersistentVolumeClaim: disco para MySQL. Sin esto, al reiniciarse el pod
# se perderian todos los datos, porque los contenedores no guardan nada.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reposicion-db-pvc
  namespace: jak-inventory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Base de datos de Reposicion. Una sola replica: una base relacional no se
# escala copiando el pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reposicion-db
  namespace: jak-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reposicion-db
  template:
    metadata:
      labels:
        app: reposicion-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: reposicion_db
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: reposicion-secret, key: DB_USUARIO }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: reposicion-secret, key: DB_CLAVE }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: reposicion-secret, key: MYSQL_ROOT_PASSWORD }
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: reposicion-db-pvc
---
# Service de la base: le da un nombre fijo (reposicion-db) dentro del
# cluster. ClusterIP = solo visible desde adentro, nunca desde internet.
apiVersion: v1
kind: Service
metadata:
  name: reposicion-db
  namespace: jak-inventory
spec:
  type: ClusterIP
  selector:
    app: reposicion-db
  ports:
    - port: 3306
      targetPort: 3306
---
# El microservicio. Dos replicas para mostrar el escalado (RNF05):
# Kubernetes reparte las peticiones entre las dos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reposicion-service
  namespace: jak-inventory
spec:
  # Una replica: este servicio recibe mucho menos trafico que Inventario.
  # Si hiciera falta se sube con  kubectl scale  (RNF05).
  replicas: 1
  selector:
    matchLabels:
      app: reposicion-service
  template:
    metadata:
      labels:
        app: reposicion-service
    spec:
      containers:
        - name: reposicion
          image: jak/reposicion:1.0
          # Never = usa la imagen que ya esta en la maquina (Minikube),
          # sin intentar bajarla de internet.
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: reposicion-config }
            - secretRef: { name: reposicion-secret }
          # readiness: ¿puede recibir trafico? Mientras no responda, el
          # Service no le manda peticiones.
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          # liveness: ¿sigue vivo? Si deja de responder, lo reinicia.
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            # requests = lo que reserva; limits = lo maximo que puede usar.
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
# Service del microservicio: nombre interno reposicion-service, puerto 8000.
# ClusterIP, porque al sistema solo se entra por el API Gateway (RNF09).
apiVersion: v1
kind: Service
metadata:
  name: reposicion-service
  namespace: jak-inventory
spec:
  type: ClusterIP
  selector:
    app: reposicion-service
  ports:
    - port: 8000
      targetPort: 8000
